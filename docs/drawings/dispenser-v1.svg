<text x="132" y="1325.5" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#7a7a7a" text-anchor="start">Item centre of mass travels 65 -> 115mm. The edge is at 105mm, so it clears by 10mm and falls.</text>
<text x="22" y="1365.1" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="bold">4. LAYOUT — 4 slots on one 350 x 105mm plate</text>
