<text x="22" y="959.2" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="bold">3. TOP VIEW — the pusher sweep</text>
<text x="22" y="979" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#7a7a7a" text-anchor="start">The arm rests BEHIND the magazines, clear of the stack, and sweeps 90 degrees to push. Nothing blocks the drop while it is parked.</text>
